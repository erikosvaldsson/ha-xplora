[project]
name = "xplora-eval"
version = "0.1.0"
description = "Evaluate pyxplora-api for passive battery/telemetry supervision across Xplora watches"
readme = "README.md"
authors = [
    { name = "Erik Osvaldsson", email = "erik@osvaldsson.se" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "pyxplora-api>=2.12.9",
]

[project.scripts]
xplora-eval = "xplora_eval:main"
xplora-probe = "xplora_eval.probe:main"
xplora-diag = "xplora_eval.diag:main"
xplora-canary = "xplora_eval.canary:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
